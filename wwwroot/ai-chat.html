<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tư Vấn Phòng Trọ — Phòng Trọ Mới</title>
    <link href="/assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #27AE60;
            --primary-dark: #1E8449;
            --primary-light: #E8F8F5;
            --danger: #E74C3C;
            --bg: #f0f2f5;
            --chat-bg: #ffffff;
            --user-bubble: linear-gradient(135deg, #27AE60, #2ECC71);
            --bot-bubble: #f0f2f5;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── Header ─────────────────────────────────────────────── */
        .chat-header {
            background: linear-gradient(135deg, #27AE60 0%, #2ECC71 100%);
            color: white;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            box-shadow: 0 2px 12px rgba(39, 174, 96, 0.3);
            flex-shrink: 0;
        }

        .chat-header .avatar {
            width: 48px; height: 48px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .chat-header .info h1 {
            font-size: 1.1rem; font-weight: 700;
            margin: 0; line-height: 1.3;
        }

        .chat-header .info p {
            font-size: 0.8rem; margin: 0;
            opacity: 0.85;
        }

        .back-link {
            color: white; text-decoration: none;
            font-size: 1.3rem; margin-right: 0.5rem;
            transition: transform 0.2s;
        }
        .back-link:hover { transform: scale(1.15); color: white; }

        /* ── Chat Area ──────────────────────────────────────────── */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* ── Message Bubbles ────────────────────────────────────── */
        .msg { display: flex; gap: 0.5rem; max-width: 80%; animation: fadeInUp 0.3s ease; }
        .msg.user { align-self: flex-end; flex-direction: row-reverse; }
        .msg.bot  { align-self: flex-start; }

        .msg .bubble {
            padding: 0.75rem 1rem;
            border-radius: 18px;
            line-height: 1.6;
            font-size: 0.92rem;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .msg.user .bubble {
            background: var(--user-bubble);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .msg.bot .bubble {
            background: var(--bot-bubble);
            color: #333;
            border-bottom-left-radius: 4px;
            border: 1px solid #e0e0e0;
        }

        .msg .icon {
            width: 32px; height: 32px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.9rem; flex-shrink: 0;
            margin-top: 2px;
        }

        .msg.bot .icon  { background: var(--primary); color: white; }
        .msg.user .icon { background: #3498db; color: white; }

        /* ── Typing Indicator ───────────────────────────────────── */
        .typing-indicator { display: flex; gap: 4px; padding: 0.6rem 1rem; }
        .typing-indicator span {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #999;
            animation: typingBounce 1.4s infinite;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-8px); opacity: 1; }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Welcome Card ───────────────────────────────────────── */
        .welcome-card {
            text-align: center;
            padding: 2rem;
            margin: auto;
            max-width: 420px;
        }

        .welcome-card .emoji { font-size: 3rem; margin-bottom: 1rem; }
        .welcome-card h2 { color: var(--primary-dark); font-weight: 700; font-size: 1.3rem; }
        .welcome-card p  { color: #666; font-size: 0.9rem; line-height: 1.7; }

        .quick-actions {
            display: flex; flex-wrap: wrap;
            gap: 0.5rem; justify-content: center;
            margin-top: 1rem;
        }

        .quick-btn {
            background: white;
            border: 1.5px solid var(--primary);
            color: var(--primary-dark);
            border-radius: 20px;
            padding: 0.4rem 1rem;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }
        .quick-btn:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.3);
        }

        /* ── Input Area ─────────────────────────────────────────── */
        .chat-input-area {
            padding: 1rem 1.5rem;
            background: white;
            border-top: 1px solid #e8e8e8;
            flex-shrink: 0;
        }

        .chat-input-area .input-group {
            background: #f5f5f5;
            border-radius: 25px;
            overflow: hidden;
            border: 2px solid transparent;
            transition: border-color 0.3s;
        }

        .chat-input-area .input-group:focus-within {
            border-color: var(--primary);
            background: white;
        }

        .chat-input-area input {
            border: none;
            background: transparent;
            padding: 0.75rem 1.25rem;
            font-size: 0.95rem;
            outline: none;
        }

        .chat-input-area input::placeholder { color: #aaa; }

        .send-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 48px; height: 48px;
            border-radius: 50%;
            margin: 4px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .send-btn:hover { background: var(--primary-dark); transform: scale(1.05); }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        /* ── Responsive ─────────────────────────────────────────── */
        @media (max-width: 576px) {
            .msg { max-width: 90%; }
            .chat-header { padding: 0.75rem 1rem; }
            .chat-area { padding: 1rem; }
            .chat-input-area { padding: 0.75rem 1rem; }
        }
    </style>
</head>
<body>

    <!-- ═══ Header ═══ -->
    <div class="chat-header">
        <a href="/" class="back-link" title="Về trang chủ"><i class="bi bi-arrow-left"></i></a>
        <div class="avatar"><i class="bi bi-robot"></i></div>
        <div class="info">
            <h1>AI Tư Vấn Phòng Trọ</h1>
            <p><i class="bi bi-circle-fill text-success" style="font-size:.5rem;"></i> Trực tuyến — Phản hồi tức thì</p>
        </div>
    </div>

    <!-- ═══ Chat Messages ═══ -->
    <div class="chat-area" id="chatArea">
        <div class="welcome-card" id="welcomeCard">
            <div class="emoji">🏠</div>
            <h2>Xin chào! Tôi là trợ lý AI</h2>
            <p>
                Tôi có thể giúp bạn tìm phòng trọ phù hợp, tư vấn giá cả,
                diện tích, vị trí và các tiện ích. Hãy hỏi tôi bất cứ điều gì!
            </p>
            <div class="quick-actions">
                <button class="quick-btn" onclick="sendQuick('Có phòng trống nào không?')">
                    🔍 Phòng trống
                </button>
                <button class="quick-btn" onclick="sendQuick('Phòng giá rẻ nhất là bao nhiêu?')">
                    💰 Giá rẻ nhất
                </button>
                <button class="quick-btn" onclick="sendQuick('Tôi cần phòng cho 2 người, có gợi ý không?')">
                    👥 Phòng 2 người
                </button>
                <button class="quick-btn" onclick="sendQuick('Cho tôi xem phòng diện tích rộng nhất')">
                    📐 Phòng rộng
                </button>
            </div>
        </div>
    </div>

    <!-- ═══ Input ═══ -->
    <div class="chat-input-area">
        <div class="input-group">
            <input type="text" id="chatInput" class="form-control"
                   placeholder="Nhập câu hỏi về phòng trọ..."
                   autocomplete="off"
                   onkeydown="if(event.key==='Enter' && !event.shiftKey) { event.preventDefault(); sendMessage(); }">
            <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="Gửi">
                <i class="bi bi-send-fill"></i>
            </button>
        </div>
        <div class="text-center mt-2">
            <small class="text-muted" style="font-size:.72rem;">
                <i class="bi bi-shield-check me-1"></i>
                AI tư vấn dựa trên dữ liệu phòng thực tế. Thông tin chỉ mang tính tham khảo.
            </small>
        </div>
    </div>

    <script>
        // ══════════════════════════════════════════════════════════════
        //  AI CHAT — Giao tiếp với /api/chat/ask
        // ══════════════════════════════════════════════════════════════

        const chatArea  = document.getElementById('chatArea');
        const chatInput = document.getElementById('chatInput');
        const sendBtn   = document.getElementById('sendBtn');
        let isWaiting   = false;

        // ── Gửi câu hỏi nhanh (quick action buttons) ────────────────
        function sendQuick(text) {
            chatInput.value = text;
            sendMessage();
        }

        // ── Gửi tin nhắn chính ───────────────────────────────────────
        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text || isWaiting) return;

            // Ẩn welcome card nếu lần đầu
            const welcome = document.getElementById('welcomeCard');
            if (welcome) welcome.remove();

            // Hiện tin nhắn người dùng
            appendMessage('user', text);
            chatInput.value = '';
            chatInput.focus();

            // Hiện hiệu ứng "Bot đang gõ..."
            const typingEl = showTyping();
            isWaiting = true;
            sendBtn.disabled = true;

            try {
                // ── Gọi API ─────────────────────────────────────────
                const res = await fetch('/api/chat/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                const data = await res.json();

                // Xóa typing indicator
                typingEl.remove();

                if (data.success) {
                    appendMessage('bot', data.reply);
                } else {
                    appendMessage('bot', data.reply || 'Xin lỗi, đã có lỗi xảy ra.');
                }
            } catch (err) {
                typingEl.remove();
                appendMessage('bot', '⚠️ Không thể kết nối đến server. Vui lòng kiểm tra lại.');
                console.error('Chat error:', err);
            } finally {
                isWaiting = false;
                sendBtn.disabled = false;
            }
        }

        // ── Thêm bubble tin nhắn ─────────────────────────────────────
        function appendMessage(role, text) {
            const div = document.createElement('div');
            div.className = 'msg ' + role;

            const iconClass = role === 'bot' ? 'bi-robot' : 'bi-person-fill';

            // Format markdown cơ bản (bold, bullet points)
            let html = escapeHtml(text)
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/^\s*[-•]\s+(.+)/gm, '&bull; $1')
                .replace(/\n/g, '<br>');

            div.innerHTML = `
                <div class="icon"><i class="bi ${iconClass}"></i></div>
                <div class="bubble">${html}</div>
            `;

            chatArea.appendChild(div);
            scrollToBottom();
        }

        // ── Hiệu ứng "Bot đang gõ..." ───────────────────────────────
        function showTyping() {
            const div = document.createElement('div');
            div.className = 'msg bot';
            div.id = 'typingMsg';
            div.innerHTML = `
                <div class="icon"><i class="bi bi-robot"></i></div>
                <div class="bubble">
                    <div class="typing-indicator">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            `;
            chatArea.appendChild(div);
            scrollToBottom();
            return div;
        }

        // ── Helpers ──────────────────────────────────────────────────
        function scrollToBottom() {
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function escapeHtml(s) {
            return s.replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;');
        }

        // Auto-focus input on load
        chatInput.focus();
    </script>

</body>
</html>
